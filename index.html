<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orvnbyte | Music</title>
<style>
  :root { --bg: #0b1437; --text: #f1f4ff; --muted: #9aa6d1; --line: #223063; --accent: #8fb0ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; padding: 72px 24px 80px; }
  h1 { font-size: 2.6rem; line-height: 1.1; font-weight: 700; margin: 0 0 16px; letter-spacing: -0.02em; }
  .intro { color: var(--muted); font-size: 1.1rem; margin: 0 0 56px; }
  h2 { font-size: 1rem; font-weight: 600; margin: 0 0 8px; }
  .song { padding: 14px 0; border-top: 1px solid var(--line); }
  .song:last-of-type { border-bottom: 1px solid var(--line); }
  .song b { display: block; font-weight: 600; }
  .song small { color: var(--muted); font-size: 0.95rem; }
  .pick { margin-top: 32px; }
  button {
    background: none; border: 0; padding: 0; font: inherit;
    color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 4px;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  #pick { margin: 8px 0 0; min-height: 1.6em; }
  footer { margin-top: 64px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Hey, I'm orvnbyte.<br>I collect songs like stars.</h1>
  <p class="intro">Notes I couldn't leave behind, kept here where the night can find them.</p>

  <h2>Favorites right now</h2>
  <div class="song"><b>Roi</b><small>Videoclub</small></div>
  <div class="song"><b>Infected</b><small>Sickick</small></div>
  <div class="song"><b>Diet Mountain Dew</b><small>Lana Del Rey</small></div>

  <div class="pick">
    <button id="btn">Surprise me with one</button>
    <p id="pick"></p>
  </div>

  <footer>orvnbyte, 2026</footer>
</main>

<script>
  document.getElementById("btn").addEventListener("click", function () {
    var songs = document.querySelectorAll(".song b");
    var chosen = songs[Math.floor(Math.random() * songs.length)];
    document.getElementById("pick").textContent = "Try: " + chosen.textContent;
  });
</script>
</body>
</html>
